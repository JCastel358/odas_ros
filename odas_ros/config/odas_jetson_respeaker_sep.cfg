version = "2.1";

raw:
{
    fS = 16000;
    hopSize = 128;
    nBits = 16;
    nChannels = 6;

    interface: {
        type = "soundcard";
        card = 2;
        device = 0;
    };
};

mapping:
{
    # Mapping indices start at 1 in ODAS.
    # ReSpeaker 6ch: (1)=processed, (2-5)=mic1-4, (6)=playback mix.
    map: (2, 3, 4, 5);
};

general:
{
    epsilon = 1E-20;

    size: { hopSize = 128; frameSize = 256; };

    samplerate: { mu = 16000; sigma2 = 0.01; };

    speedofsound: { mu = 343.0; sigma2 = 25.0; };

    mics = (
        { mu = ( -0.032, +0.000, +0.000 ); sigma2 = (0,0,0,0,0,0,0,0,0); direction = (0,0,1); angle = (80.0, 100.0); },
        { mu = ( +0.000, -0.032, +0.000 ); sigma2 = (0,0,0,0,0,0,0,0,0); direction = (0,0,1); angle = (80.0, 100.0); },
        { mu = ( +0.032, +0.000, +0.000 ); sigma2 = (0,0,0,0,0,0,0,0,0); direction = (0,0,1); angle = (80.0, 100.0); },
        { mu = ( +0.000, +0.032, +0.000 ); sigma2 = (0,0,0,0,0,0,0,0,0); direction = (0,0,1); angle = (80.0, 100.0); }
    );

    spatialfilters = (
        { direction = (0.0, 0.0, 1.0); angle = (80.0, 100.0); }
    );

    nThetas = 181;
    gainMin = 0.25;
};

# Stationnary noise estimation (MCRA)
sne:
{
    b = 3;
    alphaS = 0.1;
    L = 150;
    delta = 3.0;
    alphaD = 0.1;
};

# Sound Source Localization
ssl:
{
    nPots = 4;
    nMatches = 10;
    probMin = 0.3;
    nRefinedLevels = 1;
    interpRate = 1;

    scans = (
        { level = 2; delta = -1; },
        { level = 4; delta = -1; }
    );

    potential:
    {
        format = "json";
        interface: {
            type = "socket";
            ip = "127.0.0.1";
            port = 9001;
        };
    };
};

# Sound Source Tracking
sst:
{
    # Start with kalman (recommended), but the particle block MUST exist too.
    # Switch to "particle" later if you want.
    mode = "kalman";
    add = "dynamic";

    active = ( { weight = 1.0; mu = 0.3; sigma2 = 0.0025 } );
    inactive = ( { weight = 1.0; mu = 0.15; sigma2 = 0.0025 } );

    sigmaR2_prob   = 0.0025;
    sigmaR2_active = 0.0225;
    sigmaR2_target = 0.0025;

    Pfalse = 0.1;
    Pnew   = 0.1;
    Ptrack = 0.8;

    theta_new  = 0.9;
    N_prob     = 5;
    theta_prob = 0.8;

    N_inactive = ( 150, 200, 250, 250 );
    theta_inactive = 0.9;

    kalman: { sigmaQ = 0.001; };

    particle:
    {
        nParticles = 1000;
        st_alpha = 2.0;
        st_beta  = 0.04;
        st_ratio = 0.5;

        ve_alpha = 0.05;
        ve_beta  = 0.2;
        ve_ratio = 0.3;

        ac_alpha = 0.5;
        ac_beta  = 0.2;
        ac_ratio = 0.2;

        Nmin = 0.7;
    };

    target: ();

    tracked:
    {
        format = "json";
        interface: {
            type = "socket";
            ip = "127.0.0.1";
            port = 9000;
        };
    };
};

# Sound Source Separation
sss:
{
    # You can try mode_sep="dds" if you want the lightest compute.
    mode_sep = "dgss";
    mode_pf  = "ms";

    gain_sep = 1.0;
    gain_pf  = 10.0;

    dgss: { mu = 0.01; lambda = 0.5; };

    ms:
    {
        alphaPmin = 0.07;
        eta = 0.5;
        alphaZ = 0.8;
        thetaWin = 0.3;
        alphaWin = 0.3;
        maxAbsenceProb = 0.9;
        Gmin = 0.01;
        winSizeLocal = 3;
        winSizeGlobal = 23;
        winSizeFrame = 256;
    };

    ss:
    {
        Gmin = 0.01;
        Gmid = 0.9;
        Gslope = 10.0;
    };

    # Separated audio: ENABLED on port 10000.
    # Raw source separation, no postfiltering. Preserves hiss energy better.
    separated:
    {
        fS = 16000;
        hopSize = 128;
        nBits = 16;

        interface: {
            type = "socket";
            ip = "127.0.0.1";
            port = 10000;
        };
    };

    # Postfiltered audio: DISABLED (blackhole) for this config.
    # Use odas_jetson_respeaker_pf.cfg if you want postfiltered audio.
    postfiltered:
    {
        fS = 16000;
        hopSize = 128;
        nBits = 16;
        gain = 10.0;

        interface: {
            type = "blackhole";
        };
    };
};

# Sound Source Classification (ODAS says: "leave the following configuration")
classify:
{
    frameSize = 4096;
    winSize = 3;
    tauMin = 88;
    tauMax = 551;
    deltaTauMax = 20;
    alpha = 0.3;
    gamma = 0.05;
    phiMin = 0.5;
    r0 = 0.2;

    category:
    {
        format = "undefined";
        interface: { type = "blackhole"; };
    };
};
